name: Build with Maven, Runtime Test, and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Maven Build
        run: mvn -B clean package --file pom.xml

      - name: Verify Slimefun Legacy-style JAR name
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          EXPECTED="target/SF_RelicsOfCthonia${VERSION}.jar"
          test -s "$EXPECTED"
          unzip -tqq "$EXPECTED"
          echo "Built raw release JAR: $(basename "$EXPECTED")"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: relics-of-cthonia-${{ github.sha }}
          path: 'target/SF_RelicsOfCthonia*.jar'
          archive: false
          if-no-files-found: error

  runtime-test:
    name: Paper 26.2 + Slimefun Legacy Runtime Smoke
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Relics of Cthonia JAR
        uses: actions/download-artifact@v7
        with:
          name: relics-of-cthonia-${{ github.sha }}
          path: server/plugins

      - name: Download latest stable Paper 26.2 and Slimefun Legacy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins

          USER_AGENT='SF_RelicsOfCthonia-CI (github.com/wickidcow/SF_RelicsOfCthonia)'
          PAPER_BUILDS=$(curl -fsSL -H "User-Agent: ${USER_AGENT}" \
            https://fill.papermc.io/v3/projects/paper/versions/26.2/builds)
          PAPER_URL=$(echo "${PAPER_BUILDS}" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')
          if [ -z "${PAPER_URL}" ]; then
            echo 'No stable Paper 26.2 build was returned by the PaperMC Fill API.' >&2
            exit 1
          fi
          curl -fsSL -H "User-Agent: ${USER_AGENT}" -o server/paper.jar "${PAPER_URL}"

          SFL_RELEASE=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "User-Agent: ${USER_AGENT}" \
            https://api.github.com/repos/wickidcow/Slimefun-Legacy/releases/latest)
          SFL_URL=$(echo "${SFL_RELEASE}" | jq -r '.assets[] | select(.name | startswith("Slimefun-Legacy") and endswith(".jar")) | .browser_download_url' | head -n 1)
          if [ -z "${SFL_URL}" ] || [ "${SFL_URL}" = 'null' ]; then
            echo 'Could not resolve the latest Slimefun Legacy JAR asset.' >&2
            exit 1
          fi
          curl -fsSL -H "User-Agent: ${USER_AGENT}" -o server/plugins/Slimefun.jar "${SFL_URL}"

      - name: Start Paper and verify plugin enable
        shell: bash
        run: |
          set -euo pipefail
          cd server
          echo 'eula=true' > eula.txt

          java -Xms512M -Xmx1G -jar paper.jar --nogui > console.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' console.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          cat console.log

          if [ "${READY}" -ne 1 ]; then
            echo 'Paper did not reach a successful startup state.' >&2
            exit 1
          fi

          if grep -Eiq "Error occurred while enabling RelicsOfCthonia|Could not load.*RelicsOfCthonia|NoClassDefFoundError.*relicsofcthonia|NoSuchMethodError.*relicsofcthonia" console.log; then
            echo 'Relics of Cthonia reported a runtime linkage/enable failure.' >&2
            exit 1
          fi

          if ! grep -q 'RelicsOfCthonia' console.log; then
            echo 'Relics of Cthonia did not appear in the Paper startup log.' >&2
            exit 1
          fi

          if ! grep -q 'Addon compatibility: 1 compatible, 0 warning, 0 undeclared, 0 incompatible, 0 disabled' console.log; then
            echo 'Slimefun Legacy did not classify Relics of Cthonia as compatible.' >&2
            exit 1
          fi

  release:
    name: Publish raw GitHub Release JAR
    needs: [build, runtime-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "OUTPUT_NAME=SF_RelicsOfCthonia${VERSION}.jar" >> "$GITHUB_ENV"

      - name: Download validated raw JAR
        uses: actions/download-artifact@v7
        with:
          name: relics-of-cthonia-${{ github.sha }}
          path: dist

      - name: Verify validated release asset
        shell: bash
        run: |
          set -euo pipefail
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          unzip -tqq "$JAR"
          sha256sum "$JAR" | tee release.sha256
          echo "Release asset: ${OUTPUT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(awk '{print $1}' release.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="dist/${OUTPUT_NAME}"
          NOTES_FILE="docs/releases/${RELEASE_VERSION}.md"
          TITLE="Relics of Cthonia ${RELEASE_VERSION} — Slimefun Legacy"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "${RELEASE_TAG} is already published from ${TAG_SHA}; not replacing a released version from a different commit."
              echo 'Bump the Maven project version for the next release.'
              exit 0
            fi

            gh release upload "$RELEASE_TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
            if [[ -f "$NOTES_FILE" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES_FILE"
            else
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE"
            fi
          else
            if [[ -f "$NOTES_FILE" ]]; then
              gh release create "$RELEASE_TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes
            fi
          fi
