name: Build with Maven, Runtime Test, and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.jar-meta.outputs.version }}
      output_name: ${{ steps.jar-meta.outputs.output_name }}
      handoff_name: ${{ steps.jar-meta.outputs.handoff_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Paper 1.21.11 API floor
        run: mvn -B -ntp -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package --file pom.xml

      - name: Verify Paper 26.2 primary compatibility
        run: mvn -B -ntp -Dpaper.version=26.2.build.112-stable clean package --file pom.xml

      - name: Verify Paper 26.3 alpha compatibility
        run: mvn -B -ntp -Dpaper.version=26.3-rc-3.build.1-alpha clean package --file pom.xml

      - name: Rebuild universal release JAR from 1.21.11 baseline
        run: mvn -B -ntp -Dpaper.version=1.21.11-R0.1-SNAPSHOT clean package --file pom.xml

      - name: Verify Slimefun Legacy-style JAR name
        id: jar-meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          OUTPUT_NAME="SF_RelicsOfCthonia${VERSION}.jar"
          HANDOFF_NAME="relics-ci-${GITHUB_SHA}"
          EXPECTED="target/${OUTPUT_NAME}"
          test -s "$EXPECTED"
          unzip -tqq "$EXPECTED"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "output_name=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "handoff_name=$HANDOFF_NAME" >> "$GITHUB_OUTPUT"
          echo "Built raw release JAR: ${OUTPUT_NAME}"

      - name: Verify 1.21.11 compatibility artifact
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/${{ steps.jar-meta.outputs.output_name }}"
          unzip -p "$JAR" plugin.yml | tee /tmp/relics-plugin.yml
          grep -F "name: RelicsOfCthonia" /tmp/relics-plugin.yml
          grep -F "api-version: '1.21.11'" /tmp/relics-plugin.yml
          unzip -p "$JAR" slimefun-compatibility.json | tee /tmp/relics-compat.json
          grep -F '"minimum_minecraft": "1.21.11"' /tmp/relics-compat.json
          echo "Verifying Java 21 bytecode"
          javap -verbose -classpath "$JAR" ne.fnfal113.relicsofcthonia.RelicsOfCthonia | grep -F "major version: 65"

      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: target/${{ steps.jar-meta.outputs.output_name }}
          archive: false
          if-no-files-found: error

      - name: Upload CI handoff artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.jar-meta.outputs.handoff_name }}
          path: target/${{ steps.jar-meta.outputs.output_name }}
          if-no-files-found: error

  runtime-test:
    name: Paper ${{ matrix.paper_version }} + Slimefun Legacy Runtime Smoke
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper_version:
          - '1.21.11'
          - '26.2'

    steps:
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download validated Relics of Cthonia JAR
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.handoff_name }}
          path: server/plugins

      - name: Verify downloaded plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_NAME='${{ needs.build.outputs.output_name }}'
          test -s "server/plugins/$OUTPUT_NAME"
          unzip -tqq "server/plugins/$OUTPUT_NAME"

      - name: Download stable Paper and Slimefun Legacy
        shell: bash
        env:
          PAPER_VERSION: ${{ matrix.paper_version }}
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          USER_AGENT='SF_RelicsOfCthonia-CI (github.com/wickidcow/SF_RelicsOfCthonia)'
          PAPER_BUILDS=$(curl -fsSL -H "User-Agent: ${USER_AGENT}" "https://fill.papermc.io/v3/projects/paper/versions/${PAPER_VERSION}/builds")
          PAPER_URL=$(echo "${PAPER_BUILDS}" | jq -r 'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // empty')
          if [ -z "${PAPER_URL}" ]; then
            echo "No stable Paper ${PAPER_VERSION} build was returned by the PaperMC Fill API." >&2
            exit 1
          fi
          curl -fsSL -H "User-Agent: ${USER_AGENT}" -o server/paper.jar "${PAPER_URL}"
          SFL_RELEASE=$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "User-Agent: ${USER_AGENT}" https://api.github.com/repos/wickidcow/Slimefun-Legacy/releases/latest)
          SFL_URL=$(echo "${SFL_RELEASE}" | jq -r '.assets[] | select(.name | startswith("Slimefun-Legacy") and endswith(".jar")) | .browser_download_url' | head -n 1)
          if [ -z "${SFL_URL}" ] || [ "${SFL_URL}" = 'null' ]; then
            echo 'Could not resolve the latest Slimefun Legacy JAR asset.' >&2
            exit 1
          fi
          curl -fsSL -H "User-Agent: ${USER_AGENT}" -o server/plugins/Slimefun.jar "${SFL_URL}"

      - name: Start Paper and verify plugin enable
        shell: bash
        run: |
          set -euo pipefail
          cd server
          echo 'eula=true' > eula.txt
          echo 'Plugin directory before startup:'
          find plugins -maxdepth 1 -type f -printf '%f\n' | sort
          java -Xms512M -Xmx1G -jar paper.jar --nogui > console.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
            wait "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for _ in $(seq 1 120); do
            if grep -q 'Done (' console.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat console.log
          if [ "${READY}" -ne 1 ]; then
            echo 'Paper did not reach a successful startup state.' >&2
            exit 1
          fi
          if grep -Eiq "Unsupported API version|Error occurred while enabling RelicsOfCthonia|Could not load.*RelicsOfCthonia|NoClassDefFoundError.*relicsofcthonia|NoSuchMethodError.*relicsofcthonia" console.log; then
            echo 'Relics of Cthonia reported an API/runtime linkage or enable failure.' >&2
            exit 1
          fi
          if ! grep -q 'RelicsOfCthonia' console.log; then
            echo 'Relics of Cthonia did not appear in the Paper startup log.' >&2
            exit 1
          fi
          if ! grep -q 'Addon compatibility: 1 compatible, 0 warning, 0 undeclared, 0 incompatible, 0 disabled' console.log; then
            echo 'Slimefun Legacy did not classify Relics of Cthonia as compatible.' >&2
            exit 1
          fi

  release:
    name: Publish raw GitHub Release JAR
    needs: [build, runtime-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          OUTPUT_NAME="${{ needs.build.outputs.output_name }}"
          test -n "$VERSION"
          test -n "$OUTPUT_NAME"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "OUTPUT_NAME=$OUTPUT_NAME" >> "$GITHUB_ENV"

      - name: Download validated JAR from CI handoff
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.handoff_name }}
          path: dist

      - name: Verify validated release asset
        shell: bash
        run: |
          set -euo pipefail
          JAR="dist/${OUTPUT_NAME}"
          test -s "$JAR"
          unzip -tqq "$JAR"
          sha256sum "$JAR" | tee release.sha256
          echo "Release asset: ${OUTPUT_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $(awk '{print $1}' release.sha256)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="dist/${OUTPUT_NAME}"
          NOTES_FILE="docs/releases/${RELEASE_VERSION}.md"
          TITLE="Relics of Cthonia ${RELEASE_VERSION} — Slimefun Legacy"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "${RELEASE_TAG} is already published from ${TAG_SHA}; not replacing a released version from a different commit."
              echo 'Bump the Maven project version for the next release.'
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
            if [[ -f "$NOTES_FILE" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES_FILE"
            else
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE"
            fi
          else
            if [[ -f "$NOTES_FILE" ]]; then
              gh release create "$RELEASE_TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "Relics of Cthonia ${RELEASE_VERSION} adds Paper 26.3 alpha compile validation while preserving the Java 21 / Paper 1.21.11 universal release baseline and stable runtime smoke tests on Paper 1.21.11 and 26.2."
            fi
          fi
