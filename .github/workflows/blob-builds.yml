name: Build and Deploy to Blob-Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blob-build-deploy:
    runs-on: ubuntu-latest
    env:
      BLOB_BUILDS_API_TOKEN: ${{ secrets.BLOB_BUILDS_API_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install pinned Apache Maven 3.10.2
        shell: bash
        run: |
          set -euo pipefail
          version=3.10.2
          archive="$RUNNER_TEMP/apache-maven-${version}-bin.tar.gz"
          relative="maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz"
          curl -fsSL --retry 3 "https://downloads.apache.org/$relative" -o "$archive" || curl -fsSL --retry 3 "https://archive.apache.org/dist/$relative" -o "$archive"
          printf '%s  %s\n' '57d2db6b37e7582119137ade544557bba741b29e62109ef81539a2bdfd6d0e641fdd5d8edb014af1816d0510deac6fac8f347433b3a1aa36316ba85aa77b8119' "$archive" | sha512sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          maven_bin="$RUNNER_TEMP/apache-maven-${version}/bin"
          "$maven_bin/mvn" --version | grep -F "Apache Maven ${version}"
          printf '%s\n' "$maven_bin" >> "$GITHUB_PATH"

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload to Blob Builds
        if: env.BLOB_BUILDS_API_TOKEN != ''
        uses: WalshyDev/blob-builds/gh-action@main
        with:
          project: RelicsOfCthonia
          apiToken: ${{ env.BLOB_BUILDS_API_TOKEN }}
          releaseNotes: ${{ github.event.head_commit.message }}

      - name: Skip Blob Builds upload
        if: env.BLOB_BUILDS_API_TOKEN == ''
        run: echo 'BLOB_BUILDS_API_TOKEN is not configured; build succeeded and external upload was skipped.'
