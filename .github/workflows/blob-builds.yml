name: Build and Deploy to Blob-Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blob-build-deploy:
    runs-on: ubuntu-latest
    env:
      BLOB_BUILDS_API_TOKEN: ${{ secrets.BLOB_BUILDS_API_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload to Blob Builds
        if: env.BLOB_BUILDS_API_TOKEN != ''
        uses: WalshyDev/blob-builds/gh-action@main
        with:
          project: RelicsOfCthonia
          apiToken: ${{ env.BLOB_BUILDS_API_TOKEN }}
          releaseNotes: ${{ github.event.head_commit.message }}

      - name: Skip Blob Builds upload
        if: env.BLOB_BUILDS_API_TOKEN == ''
        run: echo 'BLOB_BUILDS_API_TOKEN is not configured; build succeeded and external upload was skipped.'
